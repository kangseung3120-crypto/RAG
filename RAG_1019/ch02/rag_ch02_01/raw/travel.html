<!doctype html><html lang="ko"><meta charset="utf-8"><title>출장 숙박 정산</title><body><nav>AI Campus · 홈 · 규정 목록</nav><article><h1>출장 숙박 정산</h1><p>국내 출장 숙박 비용 한도는 1박당 12만원입니다. 숙박 영수증을 첨부해야 정산할 수 있습니다. 한도 초과 숙박은 예약 전에 담당 임원의 서면 승인을 받아야 합니다. 승인 없이 초과 지출한 금액은 자동 정산되지 않습니다. 이 규정은 교통비와 식비를 정하지 않습니다.</p></article><footer>문의: 교육 운영팀</footer></body></html>
