# 그래프 관계 추출과 답변 생성에 사용하는 LLM 설정이에요. 이 부분은 API 요청이 발생해요.
completion_models:
  default_completion_model:
    model_provider: openai
    model: gpt-6-luna
    auth_method: api_key
    # 키를 파일에 직접 적지 않고 실행 환경의 OPENAI_API_KEY를 읽어요.
    api_key: ${OPENAI_API_KEY}
    # 재시도도 추가 요청이 될 수 있어 횟수를 제한해요.
    retry:
      type: exponential_backoff
      max_retries: 2
    call_args:
      reasoning_effort: none
      max_completion_tokens: 3072
      timeout: 60
      num_retries: 0
    # 호출 기록을 남겨 실제 사용량과 실패 지점을 확인해요.
    metrics:
      writer: file
      base_dir: verification/metrics
# 문서와 질문을 같은 E5 공간으로 변환하되 역할별 접두사는 구분해요.
embedding_models:
  # 색인할 원문과 보고서에 사용하는 문서용 임베딩이에요.
  default_embedding_model:
    type: local_e5
    model_provider: huggingface
    model: intfloat/multilingual-e5-small
    e5_prefix: 'passage: '
  # 검색 질의에는 query 접두사를 사용해요. 문서와 모델/차원은 같아야 해요.
  query_embedding_model:
    type: local_e5
    model_provider: huggingface
    model: intfloat/multilingual-e5-small
    e5_prefix: 'query: '
input:
  type: text
# GraphRAG 텍스트 단위의 분할 설정이에요. E5의 입력 창 분할은 로컬 공급자가 별도로 처리해요.
chunking:
  type: tokens
  size: 1200
  overlap: 100
  encoding_model: o200k_base
# 경로는 graphrag_demo 프로젝트를 기준으로 해석해요. input의 TXT가 색인 입력이에요.
input_storage:
  type: file
  base_dir: input
# 완성된 색인 테이블과 질의에 필요한 산출물을 저장해요.
output_storage:
  type: file
  base_dir: output
reporting:
  type: file
  base_dir: logs
# 같은 중간 요청 결과를 재사용하는 캐시예요. 캐시 사용 여부에 따라 실제 요청 수가 달라질 수 있어요.
cache:
  type: json
  storage:
    type: file
    base_dir: cache
# GraphRAG의 벡터 저장소는 로컬 LanceDB예요. 5장의 Qdrant Collection과 별개예요.
vector_store:
  type: lancedb
  db_uri: output/lancedb
  # 기본 E5 small의 출력 차원과 맞춰요. 모델을 바꾸면 벡터와 색인을 함께 다시 만들어야 해요.
  vector_size: 384
embed_text:
  embedding_model_id: default_embedding_model
# 정책, 역할, 문서, 절차, 자원을 중심으로 관계를 추출하는 수업용 프롬프트를 사용해요.
extract_graph:
  completion_model_id: default_completion_model
  prompt: prompts/extract_graph_policy.txt
  entity_types:
  - policy
  - role
  - document
  - procedure
  - resource
  # 추가 관계 추출 회차를 생략해 소규모 검증의 요청 수를 줄여요.
  max_gleanings: 0
summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: prompts/summarize_descriptions.txt
  max_length: 500
extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english
# 작은 커뮤니티를 만들고 가장 큰 연결 성분만 남기지 않도록 설정해요.
cluster_graph:
  max_cluster_size: 10
  use_lcc: false
extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: prompts/extract_claims.txt
  description: Any claims or facts that could be relevant to information discovery.
  max_gleanings: 1
# 커뮤니티 보고서는 Global/DRIFT 질의의 넓은 맥락에 쓰여요. 원문 조건 보존 여부를 검수하세요.
community_reports:
  completion_model_id: default_completion_model
  graph_prompt: prompts/community_report_graph_policy.txt
  text_prompt: prompts/community_report_text_policy.txt
  max_length: 1200
  max_input_length: 8000
snapshots:
  graphml: false
  embeddings: false
# 질문 주변의 세부 근거를 모으는 Local 질의 설정이에요.
local_search:
  completion_model_id: default_completion_model
  embedding_model_id: query_embedding_model
  prompt: prompts/local_search_system_prompt.txt
# 자료 전반의 공통 내용을 커뮤니티 보고서로 종합하는 Global 설정이에요.
global_search:
  completion_model_id: default_completion_model
  map_prompt: prompts/global_search_map_system_prompt.txt
  reduce_prompt: prompts/global_search_reduce_system_prompt.txt
  knowledge_prompt: prompts/global_search_knowledge_system_prompt.txt
# 후속 질문과 탐색 깊이를 작게 제한한 DRIFT 실습 설정이에요.
drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: query_embedding_model
  prompt: prompts/drift_search_system_prompt.txt
  reduce_prompt: prompts/drift_reduce_prompt.txt
  concurrency: 1
  primer_folds: 1
  drift_k_followups: 4
  n_depth: 1
  local_search_temperature: 1
  reduce_temperature: 1
basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: query_embedding_model
  prompt: prompts/basic_search_system_prompt.txt
